<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netflix-clone</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header>
      <div class="box"></div>
      <nav>
        <img src="netflix_logo.svg" alt="logo" height="35px" width="200px" />
        <div>
          <button class="btn">English</button>
          <button class="btn-sign">Sign In</button>
        </div>
      </nav>
      <div class="content">
        <span>Unlimited movies, shows, and more</span>
        <span>Plans start at ₹149. Cancel anytime.</span>
        <span>Ready to watch? Enter your email to start your membership.</span>
        <span class="search">
          <input type="text" placeholder="Enter Email Address" />
          <button class="btn-start">Get Started></button>
        </span>
      </div>
      <!-- trending now sectionn -->
      <div class="container">
        <div class="section-title">
            <div class="secttion-title">
                Treding Now
            </div>
        </div>
      </div>
    </header>
  </body>
</html>
